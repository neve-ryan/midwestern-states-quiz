<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midwestern States — Map Quiz</title>
<style>
:root{color-scheme:light;--ink:#20332e;--muted:#66766f;--paper:#f4f3ec;--card:#fffefa;--line:#d8ded5;--green:#245c49;--sea:#e6efec}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
main{max-width:1120px;margin:auto;padding:38px 24px 48px}
header{margin-bottom:24px}
h1{font:500 clamp(34px,5vw,54px)/1.02 Georgia,serif;letter-spacing:-.04em;margin:7px 0 8px}
.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.75fr);gap:18px}
.map-card,.side-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #20332e0a}
.map-card{padding:18px;display:flex;flex-direction:column;min-height:540px}
#map{width:100%;height:auto;min-height:400px;flex:1;background:var(--sea);border-radius:12px}
#mapContent g{cursor:pointer}
#mapContent g:focus{outline:none}
#mapContent g path{fill:#f7f5ed;stroke:#527164;stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .15s}
#mapContent g.quiz-state:hover path{fill:#d9e8de;stroke:#245c49;stroke-width:2}
#mapContent g.correct path{fill:#a9d5b8;stroke:#27734e;stroke-width:2}
#mapContent g.incorrect path{fill:#e8b9ab;stroke:#a34939;stroke-width:2}
#mapContent g.revealed path{fill:#d9e8de}
.hard-input{width:100%;height:100%;box-sizing:border-box;border:1.5px solid #527164;border-radius:3px;background:#fffefa;color:#20332e;text-align:center;font-family:system-ui,sans-serif;font-weight:600;padding:0 2px;outline:none}.hard-input:focus{border:2px solid #245c49}.hard-input[aria-invalid=true]{border-color:#a34939}
.mode-switch{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:13px;color:var(--muted)}
.side-card{padding:24px;display:flex;flex-direction:column}
.round-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:750}
.prompt{font:500 34px/1.1 Georgia,serif;margin:10px 0 6px}
.feedback{min-height:47px;padding:12px 13px;border-radius:10px;background:#f3f2ec;color:var(--muted);font-size:14px}
.feedback.good{background:#e6f2e8;color:#236443}
.feedback.bad{background:#f8eae6;color:#913f34}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 12px;border-radius:9px;font:650 13px system-ui;cursor:pointer}
.btn.primary{background:var(--green);color:white;border-color:var(--green)}
.btn:focus-visible{outline:3px solid #d6a65b;outline-offset:2px}
.score{margin-top:auto;padding-top:23px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-top:1px solid var(--line);padding-top:12px}
.stat strong{font:500 25px Georgia,serif;display:block}
.stat span{font-size:12px;color:var(--muted)}
footer{font-size:11px;color:var(--muted);margin-top:15px;text-align:center}
@media(max-width:760px){main{padding:25px 14px 32px}header{align-items:start;flex-direction:column}.layout{grid-template-columns:1fr}.map-card{min-height:420px}#map{min-height:310px}.side-card{min-height:350px}.score{margin-top:22px}}
</style>
</head>
<body>
<main>
<header><h1>Midwestern States</h1></header>
<section class="layout" aria-label="Midwestern states map quiz">
<div class="map-card"><svg id="map" viewBox="0 0 900 640" role="group" aria-label="Interactive map of 12 unlabeled Midwestern state outlines"><g id="mapContent"></g></svg></div>
<aside class="side-card"><div class="round-label" id="round">Loading map…</div><div class="prompt" id="prompt">One moment</div><label class="mode-switch"><input id="modeToggle" type="checkbox"> Hard mode</label><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn primary" id="next" type="button" disabled>Skip question</button><button class="btn" id="restart" type="button" disabled>Restart</button></div><div class="score"><div class="stat"><strong id="score">0</strong><span>correct</span></div><div class="stat"><strong id="answered">0 / 12</strong><span>answered</span></div></div></aside>
</section>
<footer>Map geometry: <a href="https://github.com/deytah/svg-us-map" target="_blank" rel="noreferrer">deytah/svg-us-map</a>, adapted from Wikimedia Commons’ “Blank US Map With Labels”; CC BY-SA 3.0.</footer>
</main>
<script>
const states=[['ND','North Dakota'],['SD','South Dakota'],['NE','Nebraska'],['KS','Kansas'],['MN','Minnesota'],['IA','Iowa'],['MO','Missouri'],['WI','Wisconsin'],['IL','Illinois'],['MI','Michigan'],['IN','Indiana'],['OH','Ohio']];
const $=id=>document.getElementById(id);
let order=[],index=0,score=0,answered=new Set(),locked=false,ready=false,finished=false,hardMode=false,groups=new Map(),fields=new Map();
function bounds(gs){let x=Infinity,y=Infinity,r=-Infinity,b=-Infinity;gs.forEach(g=>{const q=g.getBBox();x=Math.min(x,q.x);y=Math.min(y,q.y);r=Math.max(r,q.x+q.width);b=Math.max(b,q.y+q.height)});return{x,y,w:r-x,h:b-y}}
function frame(x,y,w,h,box){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform','translate('+x+' '+y+') scale('+Math.min(w/box.w,h/box.h)+') translate('+(-box.x)+' '+(-box.y)+')');return g}
function interiorPoint(path,b){const cx=b.x+b.width/2,cy=b.y+b.height/2;if(typeof path.isPointInFill!=='function')return{x:cx,y:cy};let best=null,dist=Infinity;for(let row=1;row<20;row++)for(let col=1;col<20;col++){const x=b.x+b.width*col/20,y=b.y+b.height*row/20;if(!path.isPointInFill(new DOMPoint(x,y)))continue;const d=(x-cx)*(x-cx)+(y-cy)*(y-cy);if(d<dist){dist=d;best={x,y}}}return best||{x:cx,y:cy}}
function pointNear(path,b,fx,fy){const tx=b.x+b.width*fx,ty=b.y+b.height*fy;if(typeof path.isPointInFill!=='function')return{x:tx,y:ty};let best=null,dist=Infinity;for(let row=1;row<30;row++)for(let col=1;col<30;col++){const x=b.x+b.width*col/30,y=b.y+b.height*row/30;if(!path.isPointInFill(new DOMPoint(x,y)))continue;const d=(x-tx)*(x-tx)+(y-ty)*(y-ty);if(d<dist){dist=d;best={x,y}}}return best||interiorPoint(path,b)}
function safestPoint(path,b){const length=path.getTotalLength(),edge=[];for(let i=0;i<120;i++)edge.push(path.getPointAtLength(length*i/120));let best=null,margin=-1;for(let row=1;row<40;row++)for(let col=1;col<40;col++){const x=b.x+b.width*col/40,y=b.y+b.height*row/40,p=new DOMPoint(x,y);if(!path.isPointInFill(p))continue;let min=Infinity;for(const q of edge){const dx=x-q.x,dy=y-q.y,d=dx*dx+dy*dy;if(d<min)min=d}if(min>margin){margin=min;best={x,y,clearance:Math.sqrt(min)}}}return best||interiorPoint(path,b)}
function addNameField(name,g,layer){const paths=[...g.querySelectorAll('path')];let chosen=paths[0],best=0;paths.forEach(p=>{const b=p.getBBox(),area=b.width*b.height;if(area>best){chosen=p;best=area}});if(name==='Michigan'){const candidates=paths.map(p=>({p,b:p.getBBox()})).filter(o=>o.b.width*o.b.height>=best*.12);chosen=candidates.reduce((a,o)=>o.b.y+o.b.height/2>a.b.y+a.b.height/2?o:a).p}const b=chosen.getBBox(),safe=name==='Minnesota'?safestPoint(chosen,b):null,point=name==='Michigan'?pointNear(chosen,b,.58,.66):(safe||interiorPoint(chosen,b)),desired=Math.min(76,Math.max(22,Math.min(name.length*4.7+10,b.width*.76))),width=safe?Math.min(desired,Math.max(22,safe.clearance*1.55)):desired,height=16,fontSize=Math.max(4.8,Math.min(8,width/(name.length*.62)));const fo=document.createElementNS('http://www.w3.org/2000/svg','foreignObject');fo.setAttribute('x',point.x-width/2);fo.setAttribute('y',point.y-height/2);fo.setAttribute('width',width);fo.setAttribute('height',height);fo.style.display='none';const input=document.createElementNS('http://www.w3.org/1999/xhtml','input');input.type='text';input.maxLength=32;input.autocomplete='off';input.spellcheck=false;input.className='hard-input';input.style.fontSize=fontSize+'px';input.setAttribute('aria-label','Enter state name');input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkName(name)}});input.addEventListener('input',()=>g.classList.remove('incorrect'));fo.append(input);layer.append(fo);fields.set(name,{fo,input})}
async function loadMap(){try{const response=await fetch('https://raw.githubusercontent.com/deytah/svg-us-map/main/us_map.svg');if(!response.ok)throw Error('Map source unavailable');const doc=new DOMParser().parseFromString(await response.text(),'image/svg+xml');const ids=states.map(s=>s[0]);const found=new Map([...doc.querySelectorAll('g[id]')].filter(g=>ids.includes(g.id)).map(g=>[g.id,g]));if(ids.some(id=>!found.has(id)))throw Error('Map source is missing a state');found.forEach(g=>g.querySelectorAll('text,rect').forEach(node=>node.remove()));const stage=document.createElementNS('http://www.w3.org/2000/svg','svg');stage.style.cssText='position:absolute;width:1px;height:1px;left:-9999px';document.body.append(stage);const shapes=ids.map(id=>found.get(id));shapes.forEach(g=>stage.append(g));const box=bounds(shapes),fitted=frame(26,20,848,600,box);shapes.forEach(g=>{g.removeAttribute('transform');fitted.append(g)});$('mapContent').append(fitted);const fieldLayer=document.createElementNS('http://www.w3.org/2000/svg','g');fieldLayer.setAttribute('transform',fitted.getAttribute('transform'));$('mapContent').append(fieldLayer);stage.remove();for(const [id,name] of states){const g=$('mapContent').querySelector('#'+id);g.classList.add('quiz-state');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label','Unlabeled state outline');g.addEventListener('click',()=>choose(name));g.addEventListener('keydown',e=>{if(e.target!==g)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(name)}});groups.set(name,g);addNameField(name,g,fieldLayer)}$('next').disabled=false;$('restart').disabled=false;ready=true;start()}catch(err){$('round').textContent='Map unavailable';$('prompt').textContent='';$('feedback').className='feedback bad';$('feedback').textContent='Check your connection and refresh.'}}
function update(){if(finished)return;if(hardMode){$('round').textContent='Hard mode';$('prompt').textContent='';$('next').textContent='Check answers';$('next').disabled=false;return}if(index>=order.length){finishRound();return}$('round').textContent='Question '+(index+1)+' of '+order.length;$('prompt').textContent='Find '+order[index];$('feedback').className='feedback';$('feedback').textContent='';$('next').textContent='Skip question';$('next').disabled=false;locked=false;groups.forEach(g=>g.classList.remove('correct','incorrect','revealed'))}
function render(){$('score').textContent=score;$('answered').textContent=answered.size+' / 12'}
function finishRound(){finished=true;$('round').textContent='Round complete';$('prompt').textContent='';$('feedback').className='feedback';$('feedback').textContent='Final score: '+score+' / 12';$('next').textContent='Play again';$('next').disabled=false}
function start(){if(!ready)return;order=states.map(s=>s[1]).sort(()=>Math.random()-.5);index=0;score=0;answered=new Set();locked=false;finished=false;groups.forEach(g=>g.classList.remove('correct','incorrect','revealed'));fields.forEach(({fo,input})=>{fo.style.display=hardMode?'':'none';input.disabled=false;input.value='';input.removeAttribute('aria-invalid')});$('feedback').className='feedback';$('feedback').textContent='';render();update()}
function choose(name){if(hardMode||locked||finished||index>=order.length)return;const target=order[index];answered.add(target);locked=true;if(name===target){score++;$('feedback').className='feedback good';$('feedback').textContent='Correct.';groups.get(name).classList.add('correct')}else{$('feedback').className='feedback bad';$('feedback').textContent='Incorrect — '+name+'.';groups.get(name).classList.add('incorrect');groups.get(target).classList.add('revealed')}$('next').textContent=index===order.length-1?'See results':'Next question';render()}
function normalize(value){return value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function distance(a,b){const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function matches(input,name){const a=normalize(input),b=normalize(name),abbr=states.find(s=>s[1]===name)[0].toLowerCase();if(a===b||a===abbr)return true;if(a.length<5)return false;return distance(a,b)<=1}
function checkName(name){if(!hardMode||finished)return;const {input}=fields.get(name);if(!input.value.trim())return;if(matches(input.value,name)){input.disabled=true;input.removeAttribute('aria-invalid');groups.get(name).classList.remove('incorrect');groups.get(name).classList.add('correct');if(!answered.has(name)){answered.add(name);score++;render()}$('feedback').className='feedback good';$('feedback').textContent='Correct.';if(answered.size===states.length)finishRound()}else{input.setAttribute('aria-invalid','true');groups.get(name).classList.add('incorrect');$('feedback').className='feedback bad';$('feedback').textContent='Try again.'}}
function checkAll(){let tried=false;fields.forEach(({input},name)=>{if(input.value.trim()&&!input.disabled){tried=true;checkName(name)}});if(answered.size<states.length&&tried)$('feedback').textContent='Some names need another try.'}
$('next').addEventListener('click',()=>{if(finished){start();return}if(hardMode){checkAll();return}if(index>=order.length){finishRound();return}if(!locked)answered.add(order[index]);index++;update();render()});
$('restart').addEventListener('click',start);
$('modeToggle').addEventListener('change',e=>{hardMode=e.target.checked;if(ready)start()});
loadMap();
</script>
</body>
</html>
